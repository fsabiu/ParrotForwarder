[mypy]
python_version = 3.11
strict = True
ignore_missing_imports = True
# Legacy v1 modules are not yet typed; they'll be rewritten in Phase 1/2
# (supervisor, forwarder subprocess). Until then, ignore errors inside them
# so the strict gate stays green on v2 code.
exclude = (?x)(
      ^src/parrot_forwarder/telemetry\.py$
    | ^src/parrot_forwarder/video\.py$
    | ^src/parrot_forwarder/cli\.py$
    | ^src/parrot_forwarder/klv_encoder\.py$
    | ^ParrotForwarder\.py$
  )

# Olympe and GStreamer bindings have no stubs. Allowed per T04.
[mypy-olympe]
ignore_missing_imports = True

[mypy-olympe.*]
ignore_missing_imports = True

[mypy-gi]
ignore_missing_imports = True

[mypy-gi.*]
ignore_missing_imports = True

# main.py is partially v1-shaped; we've only touched the DI seam in T03.
# Allow a relaxed gate here until T07 rewrites it around the supervisor.
[mypy-parrot_forwarder.main]
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = False
disallow_untyped_calls = False
warn_return_any = False
