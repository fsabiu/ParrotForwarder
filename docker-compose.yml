services:
  parrot-forwarder:
    build:
      context: .
      network: host
    image: parrot-forwarder:v2
    container_name: parrot-forwarder
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    network_mode: host
    devices:
      - /dev/bus/usb:/dev/bus/usb
    environment:
      PARROT_FORWARDER_SUPERVISOR__HTTP__BIND: ${PARROT_FORWARDER_SUPERVISOR__HTTP__BIND:-0.0.0.0}
      PARROT_FORWARDER_SUPERVISOR__HTTP__PORT: ${PARROT_FORWARDER_SUPERVISOR__HTTP__PORT:-8080}
      PARROT_FORWARDER_SUPERVISOR__AUTO_START: ${PARROT_FORWARDER_SUPERVISOR__AUTO_START:-true}
      PARROT_FORWARDER_SUPERVISOR__BACKOFF__BASE_SECONDS: ${PARROT_FORWARDER_SUPERVISOR__BACKOFF__BASE_SECONDS:-1.0}
      PARROT_FORWARDER_SUPERVISOR__BACKOFF__MAX_SECONDS: ${PARROT_FORWARDER_SUPERVISOR__BACKOFF__MAX_SECONDS:-1.0}
      PARROT_FORWARDER_SUPERVISOR__BACKOFF__JITTER_SECONDS: ${PARROT_FORWARDER_SUPERVISOR__BACKOFF__JITTER_SECONDS:-0.0}
      PARROT_FORWARDER_FORWARDER__SRT_PORT: ${PARROT_FORWARDER_FORWARDER__SRT_PORT:-8890}
      PARROT_FORWARDER_FORWARDER__KLV_PORT: ${PARROT_FORWARDER_FORWARDER__KLV_PORT:-12345}
      PARROT_FORWARDER_FORWARDER__TELEMETRY_FPS: ${PARROT_FORWARDER_FORWARDER__TELEMETRY_FPS:-30}
      PARROT_FORWARDER_FIELD__DASHBOARD_SCHEME: ${PARROT_FORWARDER_FIELD__DASHBOARD_SCHEME:-http}
      PARROT_FORWARDER_FIELD__TAILSCALE_HOST: ${PARROT_FORWARDER_FIELD__TAILSCALE_HOST:-}
      PARROT_FORWARDER_FIELD__ADVERTISED_DASHBOARD_HOST: ${PARROT_FORWARDER_FIELD__ADVERTISED_DASHBOARD_HOST:-}
      PARROT_FORWARDER_FIELD__ADVERTISED_DASHBOARD_PORT: ${PARROT_FORWARDER_FIELD__ADVERTISED_DASHBOARD_PORT:-}
      PARROT_FORWARDER_FIELD__ADVERTISED_SRT_HOST: ${PARROT_FORWARDER_FIELD__ADVERTISED_SRT_HOST:-}
      PARROT_FORWARDER_FIELD__ADVERTISED_SRT_PORT: ${PARROT_FORWARDER_FIELD__ADVERTISED_SRT_PORT:-}
    volumes:
      - ./var/log/parrot-forwarder:/var/log/parrot-forwarder
      - ./config:/etc/parrot-forwarder
      - ./recordings:/recordings
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
