services:
  parrot-forwarder:
    build:
      context: .
    image: parrot-forwarder:v2
    container_name: parrot-forwarder
    init: true
    restart: unless-stopped
    network_mode: host
    devices:
      - /dev/bus/usb:/dev/bus/usb
    environment:
      PARROT_FORWARDER_SUPERVISOR__HTTP__BIND: 0.0.0.0
      PARROT_FORWARDER_SUPERVISOR__AUTO_START: "true"
    volumes:
      - ./var/log/parrot-forwarder:/var/log/parrot-forwarder
      # Mount your own config if you do not want the image default.
      # - /etc/parrot-forwarder/config.yaml:/etc/parrot-forwarder/config.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
