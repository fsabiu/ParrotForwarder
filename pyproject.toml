[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parrot-forwarder"
version = "2.0.0.dev0"
description = "Parrot Anafi telemetry and video forwarder with unified SRT + MISB 0601 KLV stream"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Francesco Sabiu" }]
requires-python = ">=3.11,<3.12"
keywords = ["parrot", "anafi", "drone", "uas", "klv", "misb-0601", "srt", "gstreamer"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Video :: Capture",
    "Topic :: Scientific/Engineering",
]

# Runtime dependencies. Only direct imports are listed here; parrot-olympe pulls
# in its own transitive stack (aenum, boltons, geopy, numpy, requests, ...).
# The pinned set used for reproducible installs lives in requirements.txt.
#
# protobuf MUST stay at 3.20.3: Olympe's transitive 3.7.1 is ABI-incompatible
# with Python 3.11+, and 4.x breaks Olympe's generated messages. See v1 notes.
dependencies = [
    "parrot-olympe==0.0.0",
    "protobuf==3.20.3",
    "PyYAML>=6.0,<7",
    "pydantic>=2.6",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "pydantic>=2.6",
    "ruff>=0.4",
    "mypy>=1.10",
    "PyYAML>=6.0",
    "types-PyYAML>=6.0",
]

[project.scripts]
parrot-forwarder = "parrot_forwarder.cli:main"
parrot-forwarder-worker = "parrot_forwarder.forwarder.worker:main"

[project.urls]
Repository = "https://github.com/fsabiu/ParrotForwarder"
Issues = "https://github.com/fsabiu/ParrotForwarder/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: requires a physical Parrot Anafi + Skycontroller. Skipped by default.",
    "slow: takes more than 30 seconds. Skipped by default in the quick loop.",
]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
# Legacy v1 modules are exempt from lint until they're rewritten in Phase 1/2.
# v2 code must pass cleanly.
extend-exclude = [
    "src/parrot_forwarder/telemetry.py",
    "src/parrot_forwarder/video.py",
    "src/parrot_forwarder/main.py",
    "src/parrot_forwarder/cli.py",
    "src/parrot_forwarder/klv_encoder.py",
    "ParrotForwarder.py",
    "tests/test_drone_connection.py",
    "tests/test_klv_receiver.py",
    "tests/test_mediamtx_integration.py",
    "tests/test_telemetry_receiver.py",
    "tests/test_video_receiver.py",
    "tests/test_video_sender.py",
    "tests/test_video_stream.py",
    "tests/run_tests.py",
]

[tool.ruff.lint]
# Start conservative: pyflakes + pycodestyle basics + isort. We can tighten
# as more v2 code lands.
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # line length - handled by the formatter
]
